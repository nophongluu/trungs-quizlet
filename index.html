<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung's Quizlet - Ứng dụng Học Tập Thông Minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a092d',
                        cardBg: '#131432'
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a092d; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="app" class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-[#131432]/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="appState.navigate('home')">
                <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 font-bold">
                    🧠
                </div>
                <span class="font-black text-lg bg-gradient-to-r from-indigo-400 via-cyan-300 to-indigo-200 bg-clip-text text-transparent">
                    Trung's Quizlet
                </span>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="appState.openNewSetModal()" class="flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs sm:text-sm shadow-lg shadow-indigo-600/30 cursor-pointer">
                    <span>+ Tạo học phần</span>
                </button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="flex flex-1">
            <!-- Sidebar -->
            <aside class="w-64 min-h-[calc(100vh-65px)] bg-[#131432] border-r border-slate-800 p-4 hidden md:block space-y-6">
                <button onclick="appState.navigate('home')" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl font-bold text-sm cursor-pointer bg-indigo-600 text-white shadow-lg">
                    <span>🏠 Trang chủ</span>
                </button>

                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <div class="flex items-center justify-between px-3 text-xs font-extrabold uppercase text-slate-400">
                        <span>Your Folders</span>
                        <button onclick="appState.openNewFolderModal()" class="text-indigo-400 font-bold text-xs cursor-pointer hover:underline">+ New</button>
                    </div>

                    <div id="sidebar-folders" class="space-y-1">
                        <!-- Folders rendered dynamically -->
                    </div>
                </div>
            </aside>

            <!-- Main Dynamic Container -->
            <main id="main-content" class="flex-1 p-4 sm:p-8 max-w-7xl mx-auto space-y-8">
                <!-- Rendered by renderApp() -->
            </main>
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-root"></div>

    <script>
        // --- APP STATE & STORAGE ---
        const appState = {
            view: 'home', // home, folder-detail, set-detail, flashcards, learn, editor
            activeSetId: 'set-vol',
            activeFolderId: null,
            folders: [
                { id: 'f-sr', name: 'SR - Ielts' },
                { id: 'f-cn', name: 'Tiếng Trung' },
                { id: 'f-su', name: 'SU - Ielts' }
            ],
            sets: [
                {
                    id: 'set-vol',
                    title: 'LS19: Volunteer work',
                    description: 'Bộ từ vựng tình nguyện và hoạt động cộng đồng',
                    folderId: 'f-sr',
                    cards: [
                        {
                            id: 'c1',
                            term: 'optional | (adj) | /ˈɒp.ʃən.əl/ | English definition: available to be chosen | Example: Attendance is optional | Synonyms: voluntary, elective',
                            definition: 'tự nguyện, không bắt buộc, tuỳ chọn',
                            frontImage: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=400&auto=format&fit=crop&q=80',
                            backImage: '',
                            mastery: 2
                        },
                        {
                            id: 'c2',
                            term: 'speciality | (n) | /,speʃ.iˈæl.ə.ti/ | English definition: a product or service a region is famous for | Example: Authentic beef pho.',
                            definition: 'món đặc sản, nét đặc trưng chuyên biệt',
                            frontImage: '',
                            backImage: 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=400&auto=format&fit=crop&q=80',
                            mastery: 1
                        }
                    ]
                }
            ],
            
            navigate(v, setId, folderId) {
                this.view = v;
                if (setId) this.activeSetId = setId;
                if (folderId !== undefined) this.activeFolderId = folderId;
                renderApp();
            },

            deleteFolder(folderId, event) {
                event.stopPropagation();
                if (confirm('Bạn có chắc chắn muốn xoá thư mục này?')) {
                    this.folders = this.folders.filter(f => f.id !== folderId);
                    this.sets = this.sets.map(s => s.folderId === folderId ? { ...s, folderId: null } : s);
                    if (this.activeFolderId === folderId) {
                        this.view = 'home';
                        this.activeFolderId = null;
                    }
                    renderApp();
                }
            },

            openNewFolderModal() {
                const name = prompt('Nhập tên thư mục mới:');
                if (name && name.trim()) {
                    this.folders.push({ id: 'f-' + Date.now(), name: name.trim() });
                    renderApp();
                }
            },

            openNewSetModal() {
                const title = prompt('Nhập tiêu đề học phần mới:');
                if (title && title.trim()) {
                    const newSet = {
                        id: 'set-' + Date.now(),
                        title: title.trim(),
                        description: 'Học phần mới tạo',
                        folderId: this.activeFolderId || (this.folders[0] ? this.folders[0].id : null),
                        cards: [
                            { id: 'c-1', term: 'Hello', definition: 'Xin chào', frontImage: '', backImage: '', mastery: 0 }
                        ]
                    };
                    this.sets.unshift(newSet);
                    this.navigate('set-detail', newSet.id);
                }
            }
        };

        // --- RENDER ROUTER ---
        function renderApp() {
            // Render Sidebar Folders
            const sidebarFoldersEl = document.getElementById('sidebar-folders');
            if (sidebarFoldersEl) {
                sidebarFoldersEl.innerHTML = appState.folders.map(f => `
                    <div onclick="appState.navigate('folder-detail', null, '${f.id}')" 
                         class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-bold text-xs sm:text-sm cursor-pointer group ${appState.activeFolderId === f.id && appState.view === 'folder-detail' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800'}">
                        <div class="flex items-center gap-2.5 truncate">
                            <span>📁</span>
                            <span class="truncate">${f.name}</span>
                        </div>
                        <button onclick="appState.deleteFolder('${f.id}', event)" class="p-1 rounded hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 cursor-pointer" title="Xoá thư mục">
                            🗑️
                        </button>
                    </div>
                `).join('');
            }

            // Render Main Content
            const mainEl = document.getElementById('main-content');
            if (!mainEl) return;

            if (appState.view === 'home') {
                mainEl.innerHTML = `
                    <div class="space-y-8 animate-fadeIn">
                        <div class="space-y-4">
                            <h2 class="text-xl font-extrabold text-white">Jump back in</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${appState.sets.map(set => `
                                    <div class="rounded-3xl bg-[#131432] border border-slate-800 p-5 space-y-4 shadow-xl">
                                        <div class="flex justify-between items-center">
                                            <span class="px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 font-bold text-xs">${set.cards.length} thuật ngữ</span>
                                        </div>
                                        <h3 class="text-lg font-extrabold text-white">${set.title}</h3>
                                        <p class="text-xs text-slate-400">${set.description}</p>
                                        <button onclick="appState.navigate('set-detail', '${set.id}')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs cursor-pointer">
                                            Tiếp tục học
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (appState.view === 'set-detail') {
                const set = appState.sets.find(s => s.id === appState.activeSetId) || appState.sets[0];
                mainEl.innerHTML = `
                    <div class="space-y-8 animate-fadeIn">
                        <button onclick="appState.navigate('home')" class="text-xs font-bold text-indigo-400 cursor-pointer">← Quay lại</button>
                        <h1 class="text-3xl font-extrabold text-white">${set.title}</h1>
                        <p class="text-sm text-slate-400">${set.cards.length} thuật ngữ trong học phần</p>
                        
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                            <button onclick="alert('Chế độ Flashcards chuẩn bị sẵn sàng!')" class="p-6 rounded-3xl bg-indigo-600/20 border border-indigo-500/30 text-left space-y-2 cursor-pointer hover:border-indigo-500">
                                <div class="text-xl font-black text-white">📚 Flashcards</div>
                                <div class="text-xs text-slate-400">Lật thẻ 3D & Anki SRS</div>
                            </button>
                            <button onclick="alert('Chế độ Written AI chuẩn bị sẵn sàng!')" class="p-6 rounded-3xl bg-cyan-600/20 border border-cyan-500/30 text-left space-y-2 cursor-pointer hover:border-cyan-500">
                                <div class="text-xl font-black text-white">✍️ Written AI</div>
                                <div class="text-xs text-slate-400">Tự luận 2 chiều ngẫu nhiên</div>
                            </button>
                            <button onclick="alert('Trò chơi 60FPS chuẩn bị sẵn sàng!')" class="p-6 rounded-3xl bg-amber-600/20 border border-amber-500/30 text-left space-y-2 cursor-pointer hover:border-indigo-500">
                                <div class="text-xl font-black text-white">🎮 Games 60FPS</div>
                                <div class="text-xs text-slate-400">Blast & Blocks arcade</div>
                            </button>
                        </div>

                        <div class="space-y-3 pt-4">
                            <h3 class="text-lg font-extrabold text-white">Danh sách từ vựng</h3>
                            ${set.cards.map((c, i) => `
                                <div class="p-5 rounded-3xl bg-[#131432] border border-slate-800 flex flex-col sm:flex-row justify-between gap-4">
                                    <div class="space-y-1">
                                        <div class="text-xs font-bold text-indigo-400">#${i+1}</div>
                                        <div class="text-lg font-extrabold text-white">${c.term}</div>
                                        ${c.frontImage ? `<img src="${c.frontImage}" class="w-24 h-16 object-cover rounded-xl mt-2" />` : ''}
                                    </div>
                                    <div class="border-t sm:border-t-0 sm:border-l border-slate-800 pt-3 sm:pt-0 sm:pl-4">
                                        <div class="text-base font-bold text-emerald-300">${c.definition}</div>
                                        ${c.backImage ? `<img src="${c.backImage}" class="w-24 h-16 object-cover rounded-xl mt-2" />` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (appState.view === 'folder-detail') {
                const folder = appState.folders.find(f => f.id === appState.activeFolderId);
                const folderSets = appState.sets.filter(s => s.folderId === appState.activeFolderId);
                mainEl.innerHTML = `
                    <div class="space-y-6 animate-fadeIn">
                        <button onclick="appState.navigate('home')" class="text-xs font-bold text-indigo-400 cursor-pointer">← Quay lại</button>
                        <h1 class="text-3xl font-extrabold text-white">📁 ${folder ? folder.name : 'Thư mục'}</h1>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${folderSets.map(s => `
                                <div onclick="appState.navigate('set-detail', '${s.id}')" class="p-5 rounded-3xl bg-[#131432] border border-slate-800 cursor-pointer hover:border-indigo-500">
                                    <h3 class="font-extrabold text-lg text-white">${s.title}</h3>
                                    <p class="text-xs text-slate-400 mt-1">${s.cards.length} thuật ngữ</p>
                                </div>
                            `).join('')}
                            ${folderSets.length === 0 ? '<div class="text-slate-400 text-sm">Chưa có học phần nào trong thư mục này.</div>' : ''}
                        </div>
                    </div>
                `;
            }
        }

        // Initial render
        renderApp();
    </script>
</body>
</html>
