<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trung's Quizlet</title>
<style>
:root{--bg:#0b1024;--panel:#151d38;--panel2:#1c2747;--line:#2b385c;--text:#f4f6ff;--muted:#a7b2d0;--blue:#6675f5;--cyan:#45d4df;--green:#38c996;--red:#ff7185;--yellow:#f6c85f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#26316b 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1280px)/2));background:#111a33eF;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px;cursor:pointer}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(140deg,#7987ff,#4c55cf);display:grid;place-items:center;font-size:23px;font-weight:1000;box-shadow:0 8px 24px #5364ff55}.wrap{max-width:1280px;margin:auto;padding:26px 20px;display:grid;grid-template-columns:245px 1fr;gap:24px}.side,.panel,.card{background:linear-gradient(145deg,var(--panel),#121a32);border:1px solid var(--line);border-radius:19px}.side{padding:16px;height:max-content;position:sticky;top:88px}.side button{width:100%;text-align:left;background:transparent;padding:10px 12px;border-radius:11px;color:var(--muted);margin:2px 0}.side button:hover,.side button.active{background:#34418a66;color:white}.folder-row{display:flex;align-items:center;gap:5px}.folder-row .folder-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini{padding:4px!important;width:auto!important;font-size:12px}.main{min-width:0}.muted{color:var(--muted)}.tiny{font-size:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.panel{padding:20px;margin-bottom:18px}.card{padding:18px;min-width:0}.btn{background:var(--blue);padding:10px 15px;border-radius:11px;font-weight:750}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#2b385c}.btn.green{background:#168c6a}.btn.red{background:#a83e58}.btn.ghost{background:transparent;border:1px solid var(--line)}.input,textarea,select{background:#0d1530;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;width:100%;outline:none}.input:focus,textarea:focus,select:focus{border-color:var(--blue)}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}h1{font-size:clamp(25px,4vw,36px);margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}h3{margin:0 0 8px}.stat{font-size:26px;font-weight:900}.term{font-size:26px;font-weight:850;overflow-wrap:anywhere}.definition{font-size:20px;overflow-wrap:anywhere}.study-card{min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;cursor:pointer}.study-card img,.thumb{max-width:100%;max-height:180px;object-fit:contain;border-radius:12px;margin:14px auto}.progress{height:7px;background:#273454;border-radius:20px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--cyan))}.answer{font-size:14px;padding:12px;border-radius:11px;background:#263454;margin-top:12px}.good{color:var(--green)}.bad{color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#050817cc;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#151e3b;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 25px 80px #0009}.modal h2{margin-bottom:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .wide{grid-column:1/-1}.imagebox{display:flex;gap:10px;align-items:center}.imagebox input{flex:1}.tag{display:inline-block;padding:4px 8px;background:#303c68;border-radius:8px;color:#cbd4ff;font-size:11px}.folder-indent{padding-left:18px}.hide{display:none!important}.choice{padding:14px;border:1px solid var(--line);border-radius:12px;background:#1a2647;text-align:left}.choice:hover{border-color:var(--blue)}.choice.correct{border-color:var(--green);background:#143b39}.choice.wrong{border-color:var(--red)}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:390px;margin:auto}.cell{aspect-ratio:1;border-radius:5px;background:#253253;border:1px solid #354365}.cell.filled{background:linear-gradient(145deg,#7381ff,#3f50ba)}.blast-target{padding:15px;border:1px solid var(--line);border-radius:14px;background:#1c294b;text-align:center;font-weight:800}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#25345a;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0008}
@media(max-width:800px){.wrap{grid-template-columns:1fr;padding:16px}.side{position:static}.side .folder-list{display:grid;grid-template-columns:1fr 1fr}.top{padding:0 15px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="brand" onclick="home()"><span class="logo">T</span><span>Trung's Quizlet</span></div><div class="row"><button class="btn secondary" onclick="exportData()">↓ Xuất dữ liệu</button><button class="btn" onclick="newSet()">＋ Tạo học phần</button></div></header>
<div class="wrap"><aside class="side"><button id="homeNav" class="active" onclick="home()">⌂　Trang chủ</button><div class="row between" style="padding:14px 8px 5px"><b class="tiny muted">THƯ MỤC</b><button class="mini btn" onclick="newFolder()">＋</button></div><div id="folderList" class="folder-list"></div><hr style="border-color:var(--line);margin:15px 0"><button onclick="document.getElementById('importFile').click()">↑　Nhập dữ liệu JSON</button><input id="importFile" type="file" accept="application/json" class="hide" onchange="importData(event)"><p class="tiny muted" style="padding:8px">Dữ liệu được lưu trên trình duyệt này bằng localStorage. Hãy xuất JSON định kỳ để sao lưu.</p></aside><main id="main" class="main"></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='trungs_quizlet_v3';
const uid=()=>Math.random().toString(36).slice(2,10);
const seed={folders:[{id:'f-ielts',name:'IELTS',parentId:null},{id:'f-sr',name:'SR - IELTS',parentId:'f-ielts'},{id:'f-cn',name:'Tiếng Trung',parentId:null}],sets:[{id:'s-demo',title:'LS19: Volunteer work',description:'Từ vựng tình nguyện và hoạt động cộng đồng',folderId:'f-sr',cards:[{id:uid(),term:'volunteer',definition:'tình nguyện viên; người tình nguyện',accepted:'voluntary worker; helper',frontImage:'',backImage:''},{id:uid(),term:'speciality | (n)',definition:'đặc sản; nét đặc trưng chuyên biệt',accepted:'specialty',frontImage:'',backImage:''}]}]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){data=seed}
let view='home',folderId=null,setId=null,cardIndex=0,flipped=false,queue=[],qi=0,feedback=null,typed='',testAnswers={},testSubmitted=false,gameScore=0,gameQuestion=0,blocks=Array(64).fill(false),blockPiece=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Không đủ dung lượng lưu trữ. Hãy xuất dữ liệu JSON.')}}function toast(s){let el=document.getElementById('toastRoot');el.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>el.innerHTML='',2300)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function core(s){return String(s||'').split('|')[0].trim()}
function norm(s){return String(s||'').toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\([^)]*\)/g,' ').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim()}
function acceptedList(c,dir){let vals=dir==='en-vn'?[c.definition,...(c.accepted||'').split(/[;,]/)]:[core(c.term),...(c.accepted||'').split(/[;,]/)];return vals.map(norm).filter(Boolean)}
function checkAnswer(input,c,dir){let a=norm(input);if(!a)return false;return acceptedList(c,dir).some(x=>a===x)}
function getSet(){return data.sets.find(s=>s.id===setId)}
function go(v){view=v;render()}function home(){view='home';folderId=null;render()}
function folderTree(parent=null,depth=0){return data.folders.filter(f=>(f.parentId||null)===parent).map(f=>`<div class="folder-row" style="padding-left:${depth*13}px"><button class="folder-name" onclick="openFolder('${f.id}')">📁 ${esc(f.name)}</button><button class="mini" title="Tạo thư mục con" onclick="newFolder('${f.id}')">＋</button><button class="mini" title="Đổi tên" onclick="renameFolder('${f.id}')">✏️</button><button class="mini" title="Xóa" onclick="deleteFolder('${f.id}')">🗑</button></div>${folderTree(f.id,depth+1)}`).join('')}
function renderSidebar(){document.getElementById('folderList').innerHTML=folderTree();document.getElementById('homeNav').classList.toggle('active',view==='home')}
function render(){renderSidebar();let m=document.getElementById('main');if(view==='home')renderHome(m);else if(view==='folder')renderFolder(m);else if(view==='detail')renderDetail(m);else if(view==='edit')renderEditor(m);else if(view==='flash')renderFlash(m);else if(view==='learn')renderLearn(m);else if(view==='test')renderTest(m);else if(view==='games')renderGames(m)}
function renderHome(m){m.innerHTML=`<section class="panel"><div class="row between"><div><span class="tag">KHÔNG GIAN HỌC TẬP</span><h1 style="margin-top:10px">Học hiệu quả hơn mỗi ngày.</h1><p class="muted">Tạo học phần, ôn tập chủ động và theo dõi tiến độ của bạn.</p></div><div class="stat">📚 ${data.sets.length}<div class="tiny muted">học phần</div></div></div><div class="actions"><button class="btn" onclick="newSet()">＋ Tạo học phần</button><button class="btn secondary" onclick="newFolder()">＋ Tạo thư mục</button></div></section><div class="row between"><h2>Học phần của bạn</h2><span class="muted tiny">${data.sets.reduce((n,s)=>n+s.cards.length,0)} thẻ từ vựng</span></div><div class="grid">${data.sets.map(s=>setTile(s)).join('')||'<div class="empty">Chưa có học phần. Hãy tạo học phần đầu tiên!</div>'}</div>`}
function setTile(s){return `<article class="card"><div class="row between"><span class="tag">${s.cards.length} thẻ</span><button class="mini" onclick="editSet('${s.id}')">✏️</button></div><h3 style="margin-top:12px">${esc(s.title)}</h3><p class="muted tiny">${esc(s.description||'')}</p><p class="tiny muted">📁 ${esc(data.folders.find(f=>f.id===s.folderId)?.name||'Chưa phân loại')}</p><button class="btn" onclick="openSet('${s.id}')">Mở học phần →</button></article>`}
function openFolder(id){folderId=id;view='folder';render()}function renderFolder(m){let f=data.folders.find(x=>x.id===folderId);let ids=[folderId,...descendants(folderId)];let sets=data.sets.filter(s=>ids.includes(s.folderId));m.innerHTML=`<button class="btn ghost" onclick="home()">← Trang chủ</button><h1 style="margin-top:18px">📁 ${esc(f?.name||'Thư mục')}</h1><div class="actions" style="margin:14px 0"><button class="btn" onclick="newSet('${folderId}')">＋ Học phần trong thư mục</button><button class="btn secondary" onclick="newFolder('${folderId}')">＋ Thư mục con</button></div><div class="grid">${sets.map(setTile).join('')||'<div class="empty">Thư mục chưa có học phần.</div>'}</div>`}
function descendants(id){let a=[];data.folders.filter(f=>f.parentId===id).forEach(f=>{a.push(f.id,...descendants(f.id))});return a}
function openSet(id){setId=id;view='detail';render()}
function renderDetail(m){let s=getSet();if(!s){home();return}m.innerHTML=`<button class="btn ghost" onclick="home()">← Trang chủ</button><section class="panel" style="margin-top:16px"><div class="row between"><div><h1>${esc(s.title)}</h1><p class="muted">${esc(s.description||'')} · ${s.cards.length} thẻ</p></div><div class="actions"><button class="btn secondary" onclick="editSet('${s.id}')">✏️ Sửa học phần</button><button class="btn red" onclick="deleteSet('${s.id}')">Xóa</button></div></div></section><div class="grid"><button class="card choice" onclick="startFlash()">📚 <b>Flashcards + SRS</b><p class="tiny muted">Lật thẻ và đánh giá Again / Hard / Good / Easy</p></button><button class="card choice" onclick="startLearn()">✍️ <b>Written / Learn</b><p class="tiny muted">Luyện viết hai chiều ngẫu nhiên</p></button><button class="card choice" onclick="startTest()">📝 <b>Test</b><p class="tiny muted">Kiểm tra tổng hợp, chấm điểm tự động</p></button><button class="card choice" onclick="go('games')">🎮 <b>Games Arcade</b><p class="tiny muted">Blast và Blocks 8×8</p></button></div><div class="row between" style="margin:22px 0 12px"><h2>Danh sách thẻ</h2><button class="btn" onclick="editCard()">＋ Thêm thẻ</button></div>${s.cards.map((c,i)=>`<div class="card row between" style="margin-bottom:9px"><div style="min-width:0"><b>${esc(core(c.term))}</b><div class="muted tiny">${esc(c.definition)}</div></div><div class="actions"><button class="mini btn secondary" onclick="editCard('${c.id}')">Sửa</button><button class="mini btn red" onclick="removeCard('${c.id}')">🗑</button></div></div>`).join('')||'<div class="empty">Chưa có thẻ nào.</div>'}`}
function editSet(id){setId=id;view='edit';render()}
function renderEditor(m){let s=getSet();if(!s){home();return}m.innerHTML=`<button class="btn ghost" onclick="go('detail')">← Quay lại</button><h1 style="margin:18px 0">Chỉnh sửa học phần</h1><section class="panel"><label>Tên học phần</label><input id="setTitle" class="input" value="${esc(s.title)}"><label>Mô tả</label><input id="setDesc" class="input" value="${esc(s.description||'')}"><label>Thư mục</label><select id="setFolder" class="input"><option value="">Chưa phân loại</option>${data.folders.map(f=>`<option value="${f.id}" ${s.folderId===f.id?'selected':''}>${'—'.repeat(depth(f.id))} ${esc(f.name)}</option>`).join('')}</select><div class="actions" style="margin-top:15px"><button class="btn" onclick="saveSet()">Lưu thay đổi</button><button class="btn secondary" onclick="editCard()">＋ Thêm thẻ</button></div></section><h2>Các thẻ (${s.cards.length})</h2>${s.cards.map(c=>`<div class="card row between" style="margin-bottom:8px"><div><b>${esc(core(c.term))}</b><div class="tiny muted">${esc(c.definition)}</div></div><div class="actions"><button class="btn secondary mini" onclick="editCard('${c.id}')">Sửa</button><button class="btn red mini" onclick="removeCard('${c.id}')">Xóa</button></div></div>`).join('')}`}
function depth(id){let n=0,f=data.folders.find(x=>x.id===id);while(f?.parentId){n++;f=data.folders.find(x=>x.id===f.parentId)}return n}
function saveSet(){let s=getSet();s.title=document.getElementById('setTitle').value.trim()||'Học phần chưa đặt tên';s.description=document.getElementById('setDesc').value;s.folderId=document.getElementById('setFolder').value||null;persist();toast('Đã lưu học phần');render()}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function newSet(folder=null){let opts=data.folders.map(f=>`<option value="${f.id}" ${folder===f.id?'selected':''}>${'—'.repeat(depth(f.id))}${esc(f.name)}</option>`).join('');modal(`<h2>Tạo học phần mới</h2><label>Tên học phần</label><input id="nsTitle" class="input" placeholder="Ví dụ: LS1 - Education"><label>Mô tả</label><input id="nsDesc" class="input" placeholder="Mô tả ngắn"><label>Thư mục</label><select id="nsFolder" class="input"><option value="">Chưa phân loại</option>${opts}</select><div class="actions" style="margin-top:18px"><button class="btn" onclick="createSet()">Tạo học phần</button><button class="btn secondary" onclick="closeModal()">Hủy</button></div>`)}
function createSet(){let s={id:uid(),title:document.getElementById('nsTitle').value.trim()||'Học phần mới',description:document.getElementById('nsDesc').value,folderId:document.getElementById('nsFolder').value||null,cards:[]};data.sets.unshift(s);setId=s.id;persist();closeModal();view='edit';render()}
function newFolder(parent=null){modal(`<h2>Tạo thư mục${parent?' con':''}</h2><label>Tên thư mục</label><input id="folderName" class="input" placeholder="Tên thư mục"><div class="actions" style="margin-top:18px"><button class="btn" onclick="createFolder('${parent||''}')">Tạo</button><button class="btn secondary" onclick="closeModal()">Hủy</button></div>`)}
function createFolder(parent){let name=document.getElementById('folderName').value.trim();if(!name)return;data.folders.push({id:uid(),name,parentId:parent||null});persist();closeModal();render()}
function renameFolder(id){let f=data.folders.find(x=>x.id===id),n=prompt('Tên mới:',f.name);if(n?.trim()){f.name=n.trim();persist();render()}}
function deleteFolder(id){let ids=[id,...descendants(id)];if(!confirm('Xóa thư mục và các thư mục con? Học phần sẽ chuyển về Chưa phân loại.'))return;data.folders=data.folders.filter(f=>!ids.includes(f.id));data.sets.forEach(s=>{if(ids.includes(s.folderId))s.folderId=null});persist();if(ids.includes(folderId))home();else render()}
function deleteSet(id){if(!confirm('Xóa học phần này?'))return;data.sets=data.sets.filter(s=>s.id!==id);persist();home()}
function editCard(id){let s=getSet(),c=s.cards.find(x=>x.id===id)||{id:uid(),term:'',definition:'',accepted:'',frontImage:'',backImage:''};modal(`<h2>${id?'Sửa thẻ':'Thêm thẻ mới'}</h2><div class="formgrid"><div class="wide"><label>Thuật ngữ / từ tiếng Anh</label><textarea id="cTerm" rows="2" class="input" placeholder="Từ chính | từ loại | phiên âm">${esc(c.term)}</textarea></div><div class="wide"><label>Nghĩa tiếng Việt</label><textarea id="cDef" rows="2" class="input" placeholder="Nghĩa chính; nghĩa tương đương">${esc(c.definition)}</textarea></div><div class="wide"><label>Đáp án chấp nhận thêm (phân cách bằng dấu ; hoặc ,)</label><input id="cAccepted" class="input" value="${esc(c.accepted||'')}" placeholder="synonym; abbreviation"></div><div><label>Ảnh mặt trước (URL)</label><input id="cFront" class="input" value="${esc(c.frontImage||'')}" placeholder="https://..."></div><div><label>Ảnh mặt sau (URL)</label><input id="cBack" class="input" value="${esc(c.backImage||'')}" placeholder="https://..."></div></div><p class="tiny muted">Dán URL ảnh trực tiếp. Ảnh được hiển thị trong các chế độ học nếu URL truy cập được.</p><div class="actions" style="margin-top:18px"><button class="btn" onclick="saveCard('${c.id}')">Lưu thẻ</button><button class="btn secondary" onclick="closeModal()">Hủy</button></div>`)}
function saveCard(id){let s=getSet(),c=s.cards.find(x=>x.id===id);if(!c){c={id,term:'',definition:''};s.cards.push(c)}c.term=document.getElementById('cTerm').value.trim();c.definition=document.getElementById('cDef').value.trim();c.accepted=document.getElementById('cAccepted').value;c.frontImage=document.getElementById('cFront').value.trim();c.backImage=document.getElementById('cBack').value.trim();persist();closeModal();render()}
function removeCard(id){if(confirm('Xóa thẻ này?')){let s=getSet();s.cards=s.cards.filter(c=>c.id!==id);persist();render()}}
function startFlash(){let s=getSet();if(!s.cards.length)return toast('Hãy thêm thẻ trước');cardIndex=0;flipped=false;view='flash';render()}
function rate(r){let c=getSet().cards[cardIndex],days={Again:0,Hard:1,Good:3,Easy:7}[r];c.srs={rating:r,due:Date.now()+days*86400000,interval:days};persist();cardIndex=(cardIndex+1)%getSet().cards.length;flipped=false;render()}
function renderFlash(m){let s=getSet(),c=s.cards[cardIndex];if(!c){m.innerHTML='<div class="empty">Chưa có thẻ để học.</div>';return}let front=!flipped;m.innerHTML=`<button class="btn ghost" onclick="go('detail')">← Học phần</button><div style="max-width:760px;margin:20px auto"><div class="row between"><span class="muted tiny">FLASHCARDS · ${cardIndex+1}/${s.cards.length}</span><span class="tag">${c.srs?.rating?'Lần trước: '+c.srs.rating:'Chưa đánh giá'}</span></div><div class="progress" style="margin:12px 0 18px"><span style="width:${(cardIndex+1)/s.cards.length*100}%"></span></div><div class="panel study-card" onclick="flipped=!flipped;render()"><span class="tag">${front?'THUẬT NGỮ':'ĐỊNH NGHĨA'}</span><div class="${front?'term':'definition'}">${esc(front?c.term:c.definition)}</div>${(front?c.frontImage:c.backImage)?`<img src="${esc(front?c.frontImage:c.backImage)}" onerror="this.style.display='none'">`:''}<p class="tiny muted">Nhấn để lật thẻ</p></div><div class="row between"><button class="btn secondary" onclick="cardIndex=(cardIndex-1+s.cards.length)%s.cards.length;flipped=false;render()">← Trước</button><button class="btn secondary" onclick="flipped=!flipped;render()">Lật thẻ ↻</button><button class="btn secondary" onclick="cardIndex=(cardIndex+1)%s.cards.length;flipped=false;render()">Tiếp →</button></div>${flipped?'<p class="muted tiny" style="text-align:center;margin:16px">Bạn nhớ thẻ này ở mức nào?</p><div class="grid">'+[['Again','Quên · 0 ngày','red'],['Hard','Khó · 1 ngày','secondary'],['Good','Tốt · 3 ngày',''],['Easy','Dễ · 7 ngày','green']].map(x=>`<button class="btn ${x[2]}" onclick="rate('${x[0]}')">${x[0]}<small style="display:block;font-weight:400">${x[1]}</small></button>`).join('')+'</div>':''}</div>`}
function startLearn(){let cards=[...getSet().cards];if(!cards.length)return toast('Hãy thêm thẻ trước');queue=cards.sort(()=>Math.random()-.5).map(c=>({...c,dir:Math.random()<.5?'en-vn':'vn-en'}));qi=0;typed='';feedback=null;view='learn';render()}
function renderLearn(m){let c=queue[qi];if(!c){m.innerHTML=`<section class="panel" style="text-align:center"><h1 class="good">🎉 Hoàn thành Written!</h1><p class="muted">Bạn đã hoàn thành ${queue.length} câu.</p><button class="btn" onclick="go('detail')">Trở về học phần</button></section>`;return}let prompt=c.dir==='en-vn'?c.term:c.definition,img=c.dir==='en-vn'?c.frontImage:c.backImage;m.innerHTML=`<button class="btn ghost" onclick="go('detail')">← Học phần</button><div style="max-width:720px;margin:20px auto" class="panel"><div class="row between"><span class="tag">WRITTEN · ${qi+1}/${queue.length}</span><span class="muted tiny">${c.dir==='en-vn'?'Anh → Việt':'Việt → Anh'}</span></div><div class="progress" style="margin:12px 0 25px"><span style="width:${qi/queue.length*100}%"></span></div><div class="study-card" style="min-height:180px"><div class="term">${esc(prompt)}</div>${img?`<img src="${esc(img)}" onerror="this.style.display='none'">`:''}</div>${feedback===null?`<label>Câu trả lời của bạn</label><input id="learnInput" class="input" autocomplete="off" placeholder="Nhập câu trả lời..." value="${esc(typed)}" onkeydown="if(event.key==='Enter')submitLearn()"><button class="btn" style="width:100%;margin-top:12px" onclick="submitLearn()">Kiểm tra</button>`:`<div class="answer ${feedback?'good':'bad'}">${feedback?'✓ Chính xác!':'✗ Chưa chính xác.'}<div style="margin-top:6px;color:white">Đáp án: <b>${esc(c.dir==='en-vn'?c.definition:core(c.term))}</b></div></div><button class="btn" style="width:100%;margin-top:14px" onclick="qi++;typed='';feedback=null;render()">Tiếp tục →</button>`}</div>`}
function submitLearn(){let c=queue[qi];typed=document.getElementById('learnInput').value;feedback=checkAnswer(typed,c,c.dir);render()}
function startTest(){let s=getSet();if(!s.cards.length)return toast('Hãy thêm thẻ trước');testAnswers={};testSubmitted=false;view='test';render()}
function renderTest(m){let s=getSet();m.innerHTML=`<button class="btn ghost" onclick="go('detail')">← Học phần</button><div class="row between" style="margin:18px 0"><h1>📝 Bài kiểm tra</h1><span class="tag">${s.cards.length} câu · Anh → Việt / Việt → Anh</span></div>${s.cards.map((c,i)=>{let dir=i%2?'vn-en':'en-vn';return `<section class="panel"><b class="muted tiny">CÂU ${i+1} · ${dir==='en-vn'?'Anh → Việt':'Việt → Anh'}</b><h3 style="margin:10px 0">${esc(dir==='en-vn'?c.term:c.definition)}</h3>${(dir==='en-vn'?c.frontImage:c.backImage)?`<img class="thumb" src="${esc(dir==='en-vn'?c.frontImage:c.backImage)}">`:''}<input class="input" ${testSubmitted?'disabled':''} placeholder="Nhập đáp án..." value="${esc(testAnswers[c.id]||'')}" oninput="testAnswers['${c.id}']=this.value"></section>`}).join('')}${testSubmitted?`<section class="panel"><h2>Kết quả: ${s.cards.filter((c,i)=>checkAnswer(testAnswers[c.id],c,i%2?'vn-en':'en-vn')).length}/${s.cards.length}</h2>${s.cards.map((c,i)=>`<p class="${checkAnswer(testAnswers[c.id],c,i%2?'vn-en':'en-vn')?'good':'bad'}">${checkAnswer(testAnswers[c.id],c,i%2?'vn-en':'en-vn')?'✓':'✗'} ${esc(core(c.term))} — ${esc(c.definition)}</p>`).join('')}<button class="btn" onclick="startTest()">Làm lại</button></section>`:`<button class="btn" style="width:100%" onclick="testSubmitted=true;render()">Nộp bài</button>`}`}
function renderGames(m){m.innerHTML=`<button class="btn ghost" onclick="go('detail')">← Học phần</button><h1 style="margin:18px 0">🎮 Games Arcade</h1><div class="grid"><section class="panel"><h2>🚀 Blast</h2><p class="muted tiny">Chọn đáp án đúng để ghi điểm liên tiếp.</p><button class="btn" onclick="startBlast()">Chơi Blast</button></section><section class="panel"><h2>📦 Blocks 8×8</h2><p class="muted tiny">Chọn ô trong bảng để trả lời câu hỏi từ vựng, hoàn thành hàng/cột để ghi điểm.</p><button class="btn green" onclick="startBlocks()">Chơi Blocks</button></section></div>${gameMode==='blast'?blastHTML():gameMode==='blocks'?blocksHTML():''}`}
let gameMode='menu',blastIdx=0,blastScore=0,blockIdx=0;
function pickQuestion(){let a=getSet().cards;return a[Math.floor(Math.random()*a.length)]}
function startBlast(){gameMode='blast';blastScore=0;blastIdx=0;render()}
function blastHTML(){let c=getSet().cards[blastIdx%getSet().cards.length],others=getSet().cards.filter(x=>x.id!==c.id).sort(()=>Math.random()-.5).slice(0,3),opts=[c,...others].sort(()=>Math.random()-.5);return `<section class="panel"><div class="row between"><h2>🚀 Blast</h2><b>Điểm: ${blastScore}</b></div><div class="term" style="text-align:center;padding:22px">${esc(core(c.term))}</div><p class="muted tiny" style="text-align:center">Chọn nghĩa chính xác</p><div class="grid">${opts.map(x=>`<button class="blast-target" onclick="blastAnswer('${x.id}','${c.id}')">${esc(x.definition)}</button>`).join('')}</div><button class="btn secondary" style="margin-top:16px" onclick="gameMode='menu';render()">Thoát game</button></section>`}
function blastAnswer(chosen,right){if(chosen===right){blastScore+=10;toast('Chính xác +10 điểm!')}else toast('Chưa đúng, thử câu tiếp theo!');blastIdx++;render()}
function startBlocks(){gameMode='blocks';blocks=Array(64).fill(false);blockIdx=0;gameScore=0;render()}
function blocksHTML(){let c=getSet().cards[blockIdx%getSet().cards.length];return `<section class="panel"><div class="row between"><h2>📦 Blocks 8×8</h2><b>Điểm: ${gameScore}</b></div><p style="text-align:center">Nghĩa của <b>${esc(core(c.term))}</b> là gì?</p><div class="grid" style="grid-template-columns:repeat(2,1fr);margin:12px 0">${[c,...getSet().cards.filter(x=>x.id!==c.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5).map(x=>`<button class="choice" onclick="blockAnswer('${x.id}','${c.id}')">${esc(x.definition)}</button>`).join('')}</div><div class="board">${blocks.map((b,i)=>`<button class="cell ${b?'filled':''}" aria-label="Ô ${i+1}"></button>`).join('')}</div><p class="muted tiny" style="text-align:center">Mỗi câu đúng lấp một ô; hoàn thành hàng hoặc cột sẽ được cộng điểm thưởng.</p><button class="btn secondary" onclick="gameMode='menu';render()">Thoát game</button></section>`}
function blockAnswer(chosen,right){if(chosen===right){let i=blocks.findIndex(x=>!x);if(i>=0)blocks[i]=true;gameScore+=10;for(let r=0;r<8;r++)if(blocks.slice(r*8,r*8+8).every(Boolean)){blocks.fill(false,r*8,r*8+8);gameScore+=30}for(let c=0;c<8;c++)if(Array.from({length:8},(_,r)=>blocks[r*8+c]).every(Boolean)){for(let r=0;r<8;r++)blocks[r*8+c]=false;gameScore+=30}toast('Đúng! + điểm')}else toast('Chưa đúng!');blockIdx++;render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trungs-quizlet-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.folders)||!Array.isArray(x.sets))throw Error();data=x;persist();render();toast('Đã nhập dữ liệu')}catch(err){alert('File JSON không đúng định dạng Trung’s Quizlet')}};r.readAsText(file);e.target.value=''}
render();
</script>
</body></html>
