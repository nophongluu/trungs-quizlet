<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung's Quizlet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a092d; color: #fff; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const INITIAL_FOLDERS = [
            { id: 'f1', name: 'SR - Ielts', subfolders: [] },
            { id: 'f2', name: 'Tiếng Trung', subfolders: [] },
            { id: 'f3', name: 'SU - Ielts', subfolders: [] }
        ];

        const INITIAL_SETS = [
            {
                id: 's1',
                title: 'LS19: Volunteer work',
                folderId: 'f1',
                cards: [
                    { id: 'c1', term: 'optional | (adj) | /ˈɒp.ʃən.əl/ | English definition: available to be chosen or decided upon by preference rather than required by rule | Collocations: completely optional, optional module, optional attendance | Example: Attendance at the afternoon clinical seminar is entirely optional for final-year students.', definition: 'tự nguyện, không bắt buộc, tùy chọn Synonyms: voluntary, elective, discretionary, non-compulsory', frontImage: '', backImage: '' },
                    { id: 'c2', term: 'speciality | (n) | /ˌspeʃ.iˈæl.ə.ti/ | English definition: a product, food, or service that a specific person, restaurant, or region is particularly famous for | Collocations: regional speciality, local speciality, culinary speciality | Example: Authentic beef pho is celebrated internationally as an iconic culinary speciality of northern Vietnam.', definition: 'món đặc sản, nét đặc trưng chuyên biệt Synonyms: specialty, delicacy, signature item', frontImage: '', backImage: '' }
                ]
            }
        ];

        function App() {
            const [folders, setFolders] = useState(() => {
                const saved = localStorage.getItem('trungs_quizlet_folders');
                return saved ? JSON.parse(saved) : INITIAL_FOLDERS;
            });
            const [sets, setSets] = useState(() => {
                const saved = localStorage.getItem('trungs_quizlet_sets');
                return saved ? JSON.parse(saved) : INITIAL_SETS;
            });
            const [currentView, setCurrentView] = useState('home'); // 'home', 'set_detail', 'editor', 'flashcard', 'written', 'test', 'games'
            const [activeSetId, setActiveSetId] = useState(null);
            const [selectedFolderId, setSelectedFolderId] = useState(null);
            const [selectedSubfolder, setSelectedSubfolder] = useState(null);

            useEffect(() => {
                localStorage.setItem('trungs_quizlet_folders', JSON.stringify(folders));
            }, [folders]);

            useEffect(() => {
                localStorage.setItem('trungs_quizlet_sets', JSON.stringify(sets));
            }, [sets]);

            // Folder actions
            const handleCreateFolder = () => {
                const name = prompt('Nhập tên thư mục mới:');
                if (name && name.trim()) {
                    setFolders([...folders, { id: 'f_' + Date.now(), name: name.trim(), subfolders: [] }]);
                }
            };

            const handleDeleteFolder = (id) => {
                if (confirm('Bạn có chắc chắn muốn xoá thư mục này không?')) {
                    setFolders(folders.filter(f => f.id !== id));
                    setSets(sets.filter(s => s.folderId !== id));
                }
            };

            const handleRenameFolder = (id) => {
                const folder = folders.find(f => f.id === id);
                const newName = prompt('Đổi tên thư mục:', folder ? folder.name : '');
                if (newName && newName.trim()) {
                    setFolders(folders.map(f => f.id === id ? { ...f, name: newName.trim() } : f));
                }
            };

            return (
                <div className="flex h-screen bg-[#0a092d] text-white overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-64 bg-[#121139] border-r border-indigo-900/40 flex flex-col">
                        <div className="p-4 flex items-center space-x-3 border-b border-indigo-900/40">
                            <div className="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-black text-xl italic tracking-tighter shadow-lg shadow-blue-500/30">
                                T
                            </div>
                            <span className="font-bold text-lg tracking-tight">Trung's Quizlet</span>
                        </div>

                        <div className="p-3 flex-1 overflow-y-auto">
                            <button 
                                onClick={() => { setCurrentView('home'); setSelectedFolderId(null); setSelectedSubfolder(null); }}
                                className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition ${currentView === 'home' && !selectedFolderId ? 'bg-indigo-600 text-white' : 'text-indigo-200 hover:bg-indigo-900/50'}`}
                            >
                                <span>Trang chủ</span>
                            </button>

                            <div className="mt-6">
                                <div className="flex items-center justify-between px-3 mb-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-indigo-400">YOUR FOLDERS</span>
                                    <button onClick={handleCreateFolder} className="text-xs text-indigo-300 hover:text-white font-semibold">+ New</button>
                                </div>
                                <div className="space-y-1">
                                    {folders.map(folder => (
                                        <div key={folder.id} className="group flex items-center justify-between px-3 py-2 rounded-lg text-sm text-indigo-200 hover:bg-indigo-900/40">
                                            <div 
                                                className="flex items-center space-x-2 truncate cursor-pointer flex-1"
                                                onClick={() => { setSelectedFolderId(folder.id); setCurrentView('home'); }}
                                            >
                                                <span>📁</span>
                                                <span className="truncate">{folder.name}</span>
                                            </div>
                                            <div className="hidden group-hover:flex items-center space-x-1">
                                                <button onClick={() => handleRenameFolder(folder.id)} className="p-1 hover:text-white">✏️</button>
                                                <button onClick={() => handleDeleteFolder(folder.id)} className="p-1 hover:text-red-400">🗑️</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-16 bg-[#121139] border-b border-indigo-900/40 flex items-center justify-between px-6">
                            <div className="text-sm font-semibold text-indigo-200">
                                {currentView === 'home' ? 'Thư viện & Học phần cá nhân' : 'Khu vực học tập'}
                            </div>
                            <button 
                                onClick={() => setCurrentView('editor')}
                                className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-semibold text-sm shadow-lg shadow-blue-600/30 transition"
                            >
                                + Tạo học phần
                            </button>
                        </header>

                        <main className="flex-1 overflow-y-auto p-8">
                            {currentView === 'home' && (
                                <HomeView 
                                    sets={sets} 
                                    folders={folders}
                                    selectedFolderId={selectedFolderId}
                                    onSelectSet={(id) => { setActiveSetId(id); setCurrentView('set_detail'); }}
                                    onCreateSet={() => setCurrentView('editor')}
                                />
                            )}
                            {currentView === 'set_detail' && (
                                <SetDetailView 
                                    setObj={sets.find(s => s.id === activeSetId)}
                                    onBack={() => setCurrentView('home')}
                                    onStartFlashcards={() => setCurrentView('flashcard')}
                                    onStartWritten={() => setCurrentView('written')}
                                    onStartTest={() => setCurrentView('test')}
                                    onStartGames={() => setCurrentView('games')}
                                />
                            )}
                            {currentView === 'editor' && (
                                <SetEditorView 
                                    folders={folders}
                                    onSave={(newSet) => {
                                        setSets([...sets, newSet]);
                                        setActiveSetId(newSet.id);
                                        setCurrentView('set_detail');
                                    }}
                                    onCancel={() => setCurrentView('home')}
                                />
                            )}
                            {currentView === 'flashcard' && (
                                <FlashcardView setObj={sets.find(s => s.id === activeSetId)} onBack={() => setCurrentView('set_detail')} />
                            )}
                            {currentView === 'written' && (
                                <WrittenView setObj={sets.find(s => s.id === activeSetId)} onBack={() => setCurrentView('set_detail')} />
                            )}
                            {currentView === 'test' && (
                                <TestView setObj={sets.find(s => s.id === activeSetId)} onBack={() => setCurrentView('set_detail')} />
                            )}
                            {currentView === 'games' && (
                                <GamesView setObj={sets.find(s => s.id === activeSetId)} onBack={() => setCurrentView('set_detail')} />
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        // Home View
        function HomeView({ sets, folders, selectedFolderId, onSelectSet, onCreateSet }) {
            const filteredSets = selectedFolderId ? sets.filter(s => s.folderId === selectedFolderId) : sets;
            const folderObj = folders.find(f => f.id === selectedFolderId);

            return (
                <div className="max-w-6xl mx-auto">
                    {selectedFolderId && (
                        <div className="mb-6 p-4 bg-[#161540] border border-indigo-900/50 rounded-2xl flex items-center justify-between">
                            <h2 className="text-xl font-bold">📁 {folderObj ? folderObj.name : 'Thư mục'}</h2>
                            <span className="text-sm text-indigo-300">{filteredSets.length} học phần</span>
                        </div>
                    )}
                    <h1 className="text-2xl font-bold mb-6">{selectedFolderId ? 'Học phần trong thư mục' : 'Học phần của bạn'}</h1>
                    {filteredSets.length === 0 ? (
                        <div className="text-center py-20 bg-[#161540] rounded-3xl border border-indigo-900/40">
                            <p className="text-indigo-300 mb-4">Chưa có học phần nào ở đây cả.</p>
                            <button onClick={onCreateSet} className="bg-blue-600 px-6 py-2.5 rounded-xl font-bold">Tạo học phần ngay</button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {filteredSets.map(set => (
                                <div 
                                    key={set.id}
                                    onClick={() => onSelectSet(set.id)}
                                    className="bg-[#161540] border border-indigo-900/50 hover:border-indigo-500/50 p-6 rounded-2xl cursor-pointer transition shadow-xl"
                                >
                                    <h3 className="text-xl font-bold mb-2">{set.title}</h3>
                                    <p className="text-sm text-indigo-300">{set.cards.length} thuật ngữ</p>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // Set Detail View (Hiển thị dạng 2 cột giống Quizlet)
        function SetDetailView({ setObj, onBack, onStartFlashcards, onStartWritten, onStartTest, onStartGames }) {
            if (!setObj) return null;
            return (
                <div className="max-w-5xl mx-auto pb-20">
                    <button onClick={onBack} className="text-indigo-300 hover:text-white mb-4 text-sm font-semibold">← Quay lại</button>
                    <h1 className="text-3xl font-black mb-8">{setObj.title}</h1>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                        <button onClick={onStartFlashcards} className="bg-[#161540] border border-indigo-900 hover:border-blue-500 p-5 rounded-2xl text-left transition shadow-lg">
                            <div className="text-blue-400 font-bold mb-1">Flashcards</div>
                            <div className="text-xs text-indigo-300">Lật thẻ 3D & Anki SRS</div>
                        </button>
                        <button onClick={onStartWritten} className="bg-[#161540] border border-indigo-900 hover:border-purple-500 p-5 rounded-2xl text-left transition shadow-lg">
                            <div className="text-purple-400 font-bold mb-1">Written AI</div>
                            <div className="text-xs text-indigo-300">Tự luận 2 chiều ngẫu nhiên</div>
                        </button>
                        <button onClick={onStartTest} className="bg-[#161540] border border-indigo-900 hover:border-yellow-500 p-5 rounded-2xl text-left transition shadow-lg">
                            <div className="text-yellow-400 font-bold mb-1">Test</div>
                            <div className="text-xs text-indigo-300">Bài kiểm tra tổng hợp</div>
                        </button>
                        <button onClick={onStartGames} className="bg-[#161540] border border-indigo-900 hover:border-green-500 p-5 rounded-2xl text-left transition shadow-lg">
                            <div className="text-green-400 font-bold mb-1">Games 60FPS</div>
                            <div className="text-xs text-indigo-300">Blast thiên thạch & Xếp gạch</div>
                        </button>
                    </div>

                    <h2 className="text-xl font-bold mb-4">Danh sách thuật ngữ ({setObj.cards.length})</h2>
                    <div className="space-y-4">
                        {setObj.cards.map((card, idx) => (
                            <div key={card.id} className="bg-[#161540] border border-indigo-900/60 p-6 rounded-2xl grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                                <div>
                                    <div className="text-xs text-indigo-400 mb-1">Thuật ngữ #{idx + 1} (Mặt trước)</div>
                                    <div className="text-base font-medium whitespace-pre-wrap">{card.term}</div>
                                    {card.frontImage && <img src={card.frontImage} className="mt-3 max-h-32 rounded-lg object-cover" />}
                                </div>
                                <div className="border-t md:border-t-0 md:border-l border-indigo-900/60 pt-4 md:pt-0 md:pl-6">
                                    <div className="text-xs text-indigo-400 mb-1">Định nghĩa (Mặt sau)</div>
                                    <div className="text-base font-medium whitespace-pre-wrap">{card.definition}</div>
                                    {card.backImage && <img src={card.backImage} className="mt-3 max-h-32 rounded-lg object-cover" />}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Set Editor View (Hỗ trợ nhập nhanh hàng loạt chuẩn toàn bộ nội dung vào Mặt trước)
        function SetEditorView({ folders, onSave, onCancel }) {
            const [title, setTitle] = useState('');
            const [folderId, setFolderId] = useState(folders[0]?.id || '');
            const [cards, setCards] = useState([{ id: '1', term: '', definition: '', frontImage: '', backImage: '' }]);
            const [showBulkImport, setShowBulkImport] = useState(false);
            const [bulkText, setBulkText] = useState('');

            const addCard = () => {
                setCards([...cards, { id: Date.now().toString(), term: '', definition: '', frontImage: '', backImage: '' }]);
            };

            const updateCard = (id, field, val) => {
                setCards(cards.map(c => c.id === id ? { ...c, [field]: val } : c));
            };

            const removeCard = (id) => {
                if (cards.length > 1) setCards(cards.filter(c => c.id !== id));
            };

            const handleBulkImport = () => {
                if (!bulkText.trim()) return;
                const lines = bulkText.split('\n');
                const newCards = [];
                lines.forEach(line => {
                    if (!line.trim()) return;
                    // Tách bằng Tab hoặc dấu gạch đứng nếu có, nếu không thì đưa toàn bộ vào mặt trước
                    const parts = line.split(/\t|\|/);
                    if (parts.length >= 2) {
                        newCards.push({
                            id: 'bulk_' + Math.random(),
                            term: parts[0].trim(),
                            definition: parts.slice(1).join(' | ').trim(),
                            frontImage: '',
                            backImage: ''
                        });
                    } else {
                        newCards.push({
                            id: 'bulk_' + Math.random(),
                            term: line.trim(),
                            definition: '',
                            frontImage: '',
                            backImage: ''
                        });
                    }
                });
                if (newCards.length > 0) {
                    setCards([...cards.filter(c => c.term || c.definition), ...newCards]);
                    setShowBulkImport(false);
                    setBulkText('');
                }
            };

            return (
                <div className="max-w-4xl mx-auto pb-20">
                    <h1 className="text-2xl font-bold mb-6">Tạo học phần mới</h1>
                    <div className="space-y-4 mb-8">
                        <input 
                            type="text" 
                            placeholder="Nhập tiêu đề học phần..." 
                            value={title} 
                            onChange={e => setTitle(e.target.value)}
                            className="w-full bg-[#161540] border border-indigo-900 px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 font-semibold text-lg"
                        />
                        <select 
                            value={folderId} 
                            onChange={e => setFolderId(e.target.value)}
                            className="bg-[#161540] border border-indigo-900 px-4 py-2.5 rounded-xl focus:outline-none text-sm"
                        >
                            {folders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                        </select>
                    </div>

                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold">Thuật ngữ</h2>
                        <button 
                            onClick={() => setShowBulkImport(true)}
                            className="bg-indigo-600/50 hover:bg-indigo-600 px-4 py-2 rounded-xl text-sm font-semibold transition"
                        >
                            + Nhập nhanh hàng loạt từ Quizlet
                        </button>
                    </div>

                    {showBulkImport && (
                        <div className="mb-8 bg-[#161540] border border-indigo-800 p-6 rounded-2xl">
                            <h3 className="font-bold mb-2">Dán danh sách từ vựng</h3>
                            <textarea 
                                rows="6" 
                                placeholder="Dán nội dung từ Quizlet vào đây..." 
                                value={bulkText} 
                                onChange={e => setBulkText(e.target.value)}
                                className="w-full bg-[#0a092d] border border-indigo-900 p-3 rounded-xl mb-4 text-sm"
                            ></textarea>
                            <div className="flex space-x-3">
                                <button onClick={handleBulkImport} className="bg-blue-600 px-4 py-2 rounded-xl text-sm font-semibold">Thêm thẻ vào học phần</button>
                                <button onClick={() => setShowBulkImport(false)} className="bg-gray-700 px-4 py-2 rounded-xl text-sm font-semibold">Huỷ</button>
                            </div>
                        </div>
                    )}

                    <div className="space-y-6">
                        {cards.map((card, idx) => (
                            <div key={card.id} className="bg-[#161540] border border-indigo-900 p-6 rounded-2xl relative">
                                <div className="flex justify-between mb-4">
                                    <span className="font-bold text-indigo-400">Thẻ #{idx + 1}</span>
                                    <button onClick={() => removeCard(card.id)} className="text-red-400 text-sm hover:underline">Xoá thẻ</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <textarea 
                                        placeholder="Thuật ngữ (Mặt trước)..." 
                                        value={card.term} 
                                        onChange={e => updateCard(card.id, 'term', e.target.value)}
                                        className="bg-[#0a092d] border border-indigo-900 p-3 rounded-xl h-24 focus:outline-none"
                                    ></textarea>
                                    <textarea 
                                        placeholder="Định nghĩa (Mặt sau)..." 
                                        value={card.definition} 
                                        onChange={e => updateCard(card.id, 'definition', e.target.value)}
                                        className="bg-[#0a092d] border border-indigo-900 p-3 rounded-xl h-24 focus:outline-none"
                                    ></textarea>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-6 flex justify-between">
                        <button onClick={addCard} className="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-bold">+ Thêm thẻ</button>
                        <div className="space-x-3">
                            <button onClick={onCancel} className="bg-gray-700 px-6 py-3 rounded-xl font-bold">Huỷ</button>
                            <button onClick={() => {
                                if (!title.trim()) { alert('Vui lòng nhập tiêu đề học phần'); return; }
                                onSave({ id: 'set_' + Date.now(), title: title.trim(), folderId, cards });
                            }} className="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-bold">Lưu học phần</button>
                        </div>
                    </div>
                </div>
            );
        }

        // Flashcards View (Anki SRS)
        function FlashcardView({ setObj, onBack }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            if (!setObj || setObj.cards.length === 0) return <div>Không có thẻ nào.</div>;
            const card = setObj.cards[currentIndex];

            return (
                <div className="max-w-2xl mx-auto text-center pb-20">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={onBack} className="text-indigo-300 font-semibold">← Quay lại</button>
                        <span className="text-sm font-bold">{currentIndex + 1} / {setObj.cards.length}</span>
                    </div>

                    <div 
                        onClick={() => setIsFlipped(!isFlipped)}
                        className="w-full h-80 bg-[#161540] border border-indigo-800 rounded-3xl p-8 flex items-center justify-center cursor-pointer shadow-2xl relative text-xl font-semibold mb-6"
                    >
                        <div>{isFlipped ? card.definition : card.term}</div>
                    </div>

                    <div className="flex justify-center space-x-4">
                        <button onClick={() => { setIsFlipped(false); setCurrentIndex((currentIndex + 1) % setObj.cards.length); }} className="bg-blue-600 px-6 py-3 rounded-xl font-bold">Tiếp theo</button>
                    </div>
                </div>
            );
        }

        // Written View (2 chiều ngẫu nhiên)
        function WrittenView({ setObj, onBack }) {
            const [index, setIndex] = useState(0);
            const [input, setInput] = useState('');
            const [feedback, setFeedback] = useState(null);
            if (!setObj || setObj.cards.length === 0) return <div>Không có thẻ nào.</div>;
            const card = setObj.cards[index];

            const handleCheck = () => {
                if (input.trim().toLowerCase() === card.term.toLowerCase() || card.term.toLowerCase().includes(input.trim().toLowerCase())) {
                    setFeedback('Đính chính xác!');
                } else {
                    setFeedback('Chưa chính xác. Đáp án là: ' + card.term);
                }
            };

            return (
                <div className="max-w-xl mx-auto pb-20">
                    <button onClick={onBack} className="text-indigo-300 font-semibold mb-6">← Quay lại</button>
                    <div className="bg-[#161540] border border-indigo-900 p-8 rounded-3xl shadow-xl">
                        <div className="text-sm text-indigo-400 mb-2">Định nghĩa:</div>
                        <div className="text-lg font-bold mb-6">{card.definition}</div>
                        <input 
                            type="text" 
                            placeholder="Nhập câu trả lời của bạn..." 
                            value={input}
                            onChange={e => setInput(e.target.value)}
                            className="w-full bg-[#0a092d] border border-indigo-900 p-4 rounded-xl mb-4 focus:outline-none"
                        />
                        <button onClick={handleCheck} className="w-full bg-blue-600 py-3 rounded-xl font-bold">Kiểm tra</button>
                        {feedback && <div className="mt-4 p-3 bg-indigo-950 rounded-xl font-bold text-center">{feedback}</div>}
                    </div>
                </div>
            );
        }

        // Test View
        function TestView({ setObj, onBack }) {
            if (!setObj) return null;
            return (
                <div className="max-w-2xl mx-auto pb-20 text-center">
                    <button onClick={onBack} className="text-indigo-300 font-semibold mb-6 float-left">← Quay lại</button>
                    <h1 className="text-2xl font-bold mb-6">Bài kiểm tra tổng hợp</h1>
                    <div className="bg-[#161540] p-8 rounded-3xl">Hệ thống bài kiểm tra đang sẵn sàng cho {setObj.cards.length} thuật ngữ.</div>
                </div>
            );
        }

        // Games View
        function GamesView({ setObj, onBack }) {
            if (!setObj) return null;
            return (
                <div className="max-w-3xl mx-auto pb-20 text-center">
                    <button onClick={onBack} className="text-indigo-300 font-semibold mb-6 float-left">← Quay lại</button>
                    <h1 className="text-2xl font-bold mb-6">Trò chơi Arcade 60FPS</h1>
                    <div className="grid grid-cols-2 gap-6">
                        <div className="bg-[#161540] p-8 rounded-3xl border border-indigo-900">
                            <h3 className="font-bold text-lg mb-2">🚀 Blast Arcade</h3>
                            <p className="text-sm text-indigo-300 mb-4">Bắn thiên thạch phản xạ từ vựng.</p>
                            <button onClick={() => alert('Đang khởi chạy Blast Game!')} className="bg-blue-600 px-6 py-2.5 rounded-xl font-bold">Chơi ngay</button>
                        </div>
                        <div className="bg-[#161540] p-8 rounded-3xl border border-indigo-900">
                            <h3 className="font-bold text-lg mb-2">🧱 Blocks 8x8</h3>
                            <p className="text-sm text-indigo-300 mb-4">Xếp gạch trí tuệ kết hợp từ vựng.</p>
                            <button onClick={() => alert('Đang khởi chạy Blocks Game!')} className="bg-blue-600 px-6 py-2.5 rounded-xl font-bold">Chơi ngay</button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
