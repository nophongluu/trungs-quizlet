<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung's Quizlet - Ứng dụng Học Tập Thông Minh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { darkBg: '#0a092d', cardBg: '#131432' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #0a092d; color: #f8fafc; }</style>
</head>
<body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="app" class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-[#131432]/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.appState.navigate('home')">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg font-black text-xl tracking-tighter" style="font-family: 'Inter', sans-serif;">T</div>
                <span class="font-black text-lg bg-gradient-to-r from-indigo-400 via-cyan-300 to-indigo-200 bg-clip-text text-transparent">Trung's Quizlet</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.appState.openNewSetModal()" class="flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs sm:text-sm cursor-pointer shadow-lg shadow-indigo-600/30">
                    + Tạo học phần
                </button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="flex flex-1">
            <!-- Sidebar -->
            <aside class="w-64 min-h-[calc(100vh-65px)] bg-[#131432] border-r border-slate-800 p-4 hidden md:block space-y-6">
                <button onclick="window.appState.navigate('home')" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl font-bold text-sm cursor-pointer bg-indigo-600 text-white shadow-lg">
                    🏠 Trang chủ
                </button>
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <div class="flex items-center justify-between px-3 text-xs font-extrabold uppercase text-slate-400">
                        <span>Your Folders</span>
                        <button onclick="window.appState.openNewFolderModal()" class="text-indigo-400 font-bold text-xs cursor-pointer hover:underline">+ New</button>
                    </div>
                    <div id="sidebar-folders" class="space-y-1"></div>
                </div>
            </aside>

            <!-- Main Dynamic Container -->
            <main id="main-content" class="flex-1 p-4 sm:p-8 max-w-7xl mx-auto space-y-8"></main>
        </div>
    </div>

    <script>
        const LOCAL_STORAGE_KEY = 'trungs_quizlet_data_v2';
        
        const defaultFolders = [
            { id: 'f-sr', name: 'SR - Ielts' },
            { id: 'f-cn', name: 'Tiếng Trung' },
            { id: 'f-su', name: 'SU - Ielts' }
        ];

        const defaultSets = [
            {
                id: 'set-vol',
                title: 'LS19: Volunteer work',
                description: 'Bộ từ vựng tình nguyện và hoạt động cộng đồng',
                folderId: 'f-sr',
                cards: [
                    { id: 'c1', term: 'optional | (adj) | /ˈɒp.ʃən.əl/ | English definition: available to be chosen | Example: Attendance is optional', definition: 'tự nguyện, không bắt buộc, tuỳ chọn', frontImage: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=400&auto=format&fit=crop&q=80', backImage: '' },
                    { id: 'c2', term: 'speciality | (n) | /,speʃ.iˈæl.ə.ti/ | English definition: a product or service a region is famous for', definition: 'món đặc sản, nét đặc trưng chuyên biệt', frontImage: '', backImage: 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=400&auto=format&fit=crop&q=80' }
                ]
            }
        ];

        function loadStoredData() {
            try {
                const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return { folders: defaultFolders, sets: defaultSets };
        }

        function saveStoredData(folders, sets) {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({ folders, sets }));
            } catch (e) {}
        }

        const initialData = loadStoredData();

        const appState = {
            view: 'home',
            activeSetId: 'set-vol',
            activeFolderId: null,
            flashcardIndex: 0,
            flashcardFlipped: false,
            learnIndex: 0,
            learnQueue: [],
            learnAnswer: '',
            learnResult: null,
            gameMode: 'menu',
            folders: initialData.folders,
            sets: initialData.sets,

            persist() {
                saveStoredData(this.folders, this.sets);
            },

            navigate(v, setId, folderId) {
                this.view = v;
                if (setId) this.activeSetId = setId;
                if (folderId !== undefined) this.activeFolderId = folderId;
                if (v === 'learn') {
                    const set = this.sets.find(s => s.id === this.activeSetId);
                    this.learnQueue = (set ? set.cards : []).map(c => ({
                        ...c,
                        direction: Math.random() > 0.5 ? 'en-to-vn' : 'vn-to-en'
                    }));
                    this.learnIndex = 0;
                    this.learnAnswer = '';
                    this.learnResult = null;
                }
                if (v === 'flashcards') {
                    this.flashcardIndex = 0;
                    this.flashcardFlipped = false;
                }
                if (v === 'games') {
                    this.gameMode = 'menu';
                }
                renderApp();
            },

            renameFolder(folderId, event) {
                event.stopPropagation();
                const folder = this.folders.find(f => f.id === folderId);
                if (!folder) return;
                const newName = prompt('Nhập tên mới cho thư mục:', folder.name);
                if (newName && newName.trim()) {
                    folder.name = newName.trim();
                    this.persist();
                    renderApp();
                }
            },

            deleteFolder(folderId, event) {
                event.stopPropagation();
                if (confirm('Bạn có chắc chắn muốn xoá thư mục này?')) {
                    this.folders = this.folders.filter(f => f.id !== folderId);
                    this.sets = this.sets.map(s => s.folderId === folderId ? { ...s, folderId: null } : s);
                    if (this.activeFolderId === folderId) {
                        this.view = 'home';
                        this.activeFolderId = null;
                    }
                    this.persist();
                    renderApp();
                }
            },

            openNewFolderModal() {
                const name = prompt('Nhập tên thư mục mới:');
                if (name && name.trim()) {
                    this.folders.push({ id: 'f-' + Date.now(), name: name.trim() });
                    this.persist();
                    renderApp();
                }
            },

            openNewSetModal() {
                const title = prompt('Nhập tiêu đề học phần mới:');
                if (title && title.trim()) {
                    const newSet = {
                        id: 'set-' + Date.now(),
                        title: title.trim(),
                        description: 'Học phần mới tạo',
                        folderId: this.activeFolderId || (this.folders[0] ? this.folders[0].id : null),
                        cards: [
                            { id: 'c-1', term: 'optional | (adj) | /ˈɒp.ʃən.əl/', definition: 'tự nguyện', frontImage: '', backImage: '' }
                        ]
                    };
                    this.sets.unshift(newSet);
                    this.persist();
                    this.navigate('set-detail', newSet.id);
                }
            }
        };

        window.appState = appState;

        function renderApp() {
            const sidebarFoldersEl = document.getElementById('sidebar-folders');
            if (sidebarFoldersEl) {
                sidebarFoldersEl.innerHTML = appState.folders.map(f => `
                    <div onclick="window.appState.navigate('folder-detail', null, '${f.id}')" 
                         class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-bold text-xs sm:text-sm cursor-pointer group ${appState.activeFolderId === f.id && appState.view === 'folder-detail' ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800'}">
                        <div class="flex items-center gap-2.5 truncate">
                            <span>📁</span>
                            <span class="truncate">${f.name}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="window.appState.renameFolder('${f.id}', event)" class="p-1 rounded hover:bg-indigo-500/20 text-slate-400 hover:text-indigo-300 cursor-pointer text-xs" title="Đổi tên thư mục">✏️</button>
                            <button onclick="window.appState.deleteFolder('${f.id}', event)" class="p-1 rounded hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 cursor-pointer text-xs" title="Xoá thư mục">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }

            const mainEl = document.getElementById('main-content');
            if (!mainEl) return;

            if (appState.view === 'home') {
                mainEl.innerHTML = `
                    <div class="space-y-8 animate-fadeIn">
                        <div class="space-y-4">
                            <h2 class="text-xl font-extrabold text-white">Jump back in</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${appState.sets.map(set => `
                                    <div class="rounded-3xl bg-[#131432] border border-slate-800 p-5 space-y-4 shadow-xl">
                                        <div class="flex justify-between items-center">
                                            <span class="px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 font-bold text-xs">${set.cards.length} thuật ngữ</span>
                                        </div>
                                        <h3 class="text-lg font-extrabold text-white">${set.title}</h3>
                                        <p class="text-xs text-slate-400">${set.description}</p>
                                        <button onclick="window.appState.navigate('set-detail', '${set.id}')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs cursor-pointer">
                                            Tiếp tục học
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (appState.view === 'folder-detail') {
                const folder = appState.folders.find(f => f.id === appState.activeFolderId);
                const folderSets = appState.sets.filter(s => s.folderId === appState.activeFolderId);
                mainEl.innerHTML = `
                    <div class="space-y-6 animate-fadeIn">
                        <button onclick="window.appState.navigate('home')" class="text-xs font-bold text-indigo-400 cursor-pointer">← Quay lại</button>
                        <div class="flex items-center justify-between">
                            <h1 class="text-3xl font-extrabold text-white">📁 ${folder ? folder.name : 'Thư mục'}</h1>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${folderSets.map(s => `
                                <div onclick="window.appState.navigate('set-detail', '${s.id}')" class="p-5 rounded-3xl bg-[#131432] border border-slate-800 cursor-pointer hover:border-indigo-500">
                                    <h3 class="font-extrabold text-lg text-white">${s.title}</h3>
                                    <p class="text-xs text-slate-400 mt-1">${s.cards.length} thuật ngữ</p>
                                </div>
                            `).join('')}
                            ${folderSets.length === 0 ? '<div class="text-slate-400 text-sm">Chưa có học phần nào trong thư mục này.</div>' : ''}
                        </div>
                    </div>
                `;
            } else if (appState.view === 'set-detail') {
                const set = appState.sets.find(s => s.id === appState.activeSetId) || appState.sets[0];
                mainEl.innerHTML = `
                    <div class="space-y-8 animate-fadeIn">
                        <button onclick="window.appState.navigate('home')" class="text-xs font-bold text-indigo-400 cursor-pointer">← Quay lại</button>
                        <div class="flex items-center justify-between">
                            <h1 class="text-3xl font-extrabold text-white">${set.title}</h1>
                        </div>
                        <p class="text-sm text-slate-400">${set.cards.length} thuật ngữ trong học phần</p>
                        
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <button onclick="window.appState.navigate('flashcards')" class="p-6 rounded-3xl bg-indigo-600/20 border border-indigo-500/30 text-left space-y-2 cursor-pointer hover:border-indigo-500">
                                <div class="text-lg font-black text-white">📚 Flashcards</div>
                                <div class="text-xs text-slate-400">Lật thẻ 3D & Anki SRS</div>
                            </button>
                            <button onclick="window.appState.navigate('learn')" class="p-6 rounded-3xl bg-cyan-600/20 border border-cyan-500/30 text-left space-y-2 cursor-pointer hover:border-cyan-500">
                                <div class="text-lg font-black text-white">✍️ Written AI</div>
                                <div class="text-xs text-slate-400">Tự luận 2 chiều ngẫu nhiên</div>
                            </button>
                            <button onclick="window.appState.navigate('test')" class="p-6 rounded-3xl bg-emerald-600/20 border border-emerald-500/30 text-left space-y-2 cursor-pointer hover:border-emerald-500">
                                <div class="text-lg font-black text-white">📝 Test</div>
                                <div class="text-xs text-slate-400">Bài kiểm tra tổng hợp</div>
                            </button>
                            <button onclick="window.appState.navigate('games')" class="p-6 rounded-3xl bg-amber-600/20 border border-amber-500/30 text-left space-y-2 cursor-pointer hover:border-amber-500">
                                <div class="text-lg font-black text-white">🎮 Games 60FPS</div>
                                <div class="text-xs text-slate-400">Blast & Blocks arcade</div>
                            </button>
                        </div>
                    </div>
                `;
            } else if (appState.view === 'flashcards') {
                const set = appState.sets.find(s => s.id === appState.activeSetId);
                const card = set.cards[appState.flashcardIndex];
                mainEl.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-6 animate-fadeIn">
                        <button onclick="window.appState.navigate('set-detail')" class="text-xs font-bold text-indigo-400 cursor-pointer">← Quay lại học phần</button>
                        <div class="text-xs text-slate-400 text-right">Thẻ ${appState.flashcardIndex + 1} / ${set.cards.length}</div>
                        <div onclick="appState.flashcardFlipped = !appState.flashcardFlipped; renderApp();" class="p-10 rounded-3xl bg-[#131432] border border-indigo-500/40 text-center cursor-pointer min-h-[260px] flex flex-col justify-center space-y-4 shadow-2xl">
                            <div class="text-xs font-bold text-indigo-300 uppercase">${appState.flashcardFlipped ? 'Mặt sau (Định nghĩa)' : 'Mặt trước (Thuật ngữ)'}</div>
                            <div class="text-2xl font-black text-white">${appState.flashcardFlipped ? card.definition : card.term}</div>
                            <div class="text-xs text-slate-400">Nhấn vào thẻ để lật</div>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="window.appState.flashcardIndex = (window.appState.flashcardIndex + 1) % ${set.cards.length}; window.appState.flashcardFlipped = false; renderApp();" class="p-3 rounded-xl bg-rose-600/20 text-rose-300 font-bold text-xs cursor-pointer">1. Again</button>
                            <button onclick="window.appState.flashcardIndex = (window.appState.flashcardIndex + 1) % ${set.cards.length}; window.appState.flashcardFlipped = false; renderApp();" class="p-3 rounded-xl bg-amber-600/20 text-amber-300 font-bold text-xs cursor-pointer">2. Hard</button>
                            <button onclick="window.appState.flashcardIndex = (window.appState.flashcardIndex + 1) % ${set.cards.length}; window.appState.flashcardFlipped = false; renderApp();" class="p-3 rounded-xl bg-indigo-600/20 text-indigo-300 font-bold text-xs cursor-pointer">3. Good</button>
                            <button onclick="window.appState.flashcardIndex = (window.appState.flashcardIndex + 1) % ${set.cards.length}; window.appState.flashcardFlipped = false; renderApp();" class="p-3 rounded-xl bg-emerald-600/20 text-emerald-300 font-bold text-xs cursor-pointer">4. Easy</button>
                        </div>
                    </div>
                `;
            } else if (appState.view === 'learn') {
                const q = appState.learnQueue[appState.learnIndex];
                if (!q) {
                    mainEl.innerHTML = `
                        <div class="max-w-xl mx-auto text-center space-y-6 py-12">
                            <h2 class="text-2xl font-black text-emerald-400">🎉 Hoàn thành phiên Written AI!</h2>
                            <button onclick="window.appState.navigate('set-detail')" class="px-6 py-3 rounded-2xl bg-indigo-600 text-white font-bold text-sm cursor-pointer">Trở về học phần</button>
                        </div>
                    `;
                    return;
                }
                const target = q.direction === 'en-to-vn' ? q.definition : q.term;
                mainEl.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-6 animate-fadeIn">
                        <button onclick="window.appState.navigate('set-detail')" class="text-xs font-bold text-indigo-400 cursor-pointer">← Quay lại học phần</button>
                        <div class="text-xs text-slate-400 text-right">Câu ${appState.learnIndex + 1} / ${appState.learnQueue.length} (${q.direction === 'en-to-vn' ? 'Viết nghĩa' : 'Viết từ'})</div>
                        <div class="p-8 rounded-3xl bg-[#131432] border border-slate-800 space-y-6 shadow-2xl">
                            <div class="space-y-2">
                                <span class="px-3 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 text-xs font-bold uppercase">${q.direction === 'en-to-vn' ? 'Thuật ngữ gốc' : 'Ý nghĩa tiếng Việt'}</span>
                                <div class="text-2xl font-black text-white">${q.direction === 'en-to-vn' ? q.term : q.definition}</div>
                            </div>
                            <div class="space-y-4">
                                <input id="user-ans" type="text" value="${appState.learnAnswer}" oninput="window.appState.learnAnswer = this.value" placeholder="Nhập câu trả lời..." class="w-full px-4 py-3 rounded-xl bg-[#0a0b16] border border-slate-800 text-white text-sm" />
                                ${!appState.learnResult ? `
                                    <button onclick="
                                        const val = document.getElementById('user-ans').value.trim().toLowerCase();
                                        const cleanTarget = '${target}'.toLowerCase();
                                        const correct = val.length > 0 && cleanTarget.includes(val);
                                        window.appState.learnResult = correct ? 'Chính xác!' : 'Chưa đúng. Đáp án: ${target}';
                                        renderApp();
                                    " class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm cursor-pointer">Kiểm tra</button>
                                ` : `
                                    <div class="p-3 rounded-xl bg-slate-800 text-sm font-bold">${appState.learnResult}</div>
                                    <button onclick="window.appState.learnIndex++; window.appState.learnAnswer=''; window.appState.learnResult=null; renderApp();" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm cursor-pointer">Tiếp tục</button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            } else if (appState.view === 'test') {
                const set = appState.sets.find(s => s.id === appState.activeSetId);
                mainEl.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-6 animate-fadeIn">
                        <button onclick="window.appState.navigate('set-detail')" class="text-xs font-bold text-indigo-400 cursor-pointer">← Quay lại học phần</button>
                        <h2 class="text-xl font-extrabold text-white">📝 Bài kiểm tra tổng hợp</h2>
                        ${set.cards.map((c, i) => `
                            <div class="p-5 rounded-3xl bg-[#131432] border border-slate-800 space-y-3">
                                <div class="font-bold text-sm text-indigo-400">Câu #${i+1}</div>
                                <div class="text-base font-extrabold text-white">Nghĩa: <span class="text-emerald-300">${c.definition}</span> là gì?</div>
                                <input type="text" placeholder="Nhập từ vựng..." class="w-full px-4 py-2.5 rounded-xl bg-[#0a0b16] border border-slate-800 text-white text-sm" />
                            </div>
                        `).join('')}
                        <button onclick="alert('Đã nộp bài kiểm tra thành công!')" class="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-bold text-sm cursor-pointer">Nộp bài</button>
                    </div>
                `;
            } else if (appState.view === 'games') {
                if (appState.gameMode === 'menu') {
                    mainEl.innerHTML = `
                        <div class="max-w-3xl mx-auto space-y-6 animate-fadeIn">
                            <button onclick="window.appState.navigate('set-detail')" class="text-xs font-bold text-indigo-400 cursor-pointer">← Quay lại học phần</button>
                            <h2 class="text-2xl font-black text-white">🎮 Trò chơi Arcade 60FPS</h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                <button onclick="window.appState.gameMode = 'blast'; renderApp();" class="p-8 rounded-3xl bg-indigo-600/20 border border-indigo-500/40 hover:border-indigo-500 text-left space-y-3 cursor-pointer shadow-xl">
                                    <div class="text-xl font-black text-white">🚀 Blast (Bắn thiên thạch)</div>
                                    <p class="text-xs text-slate-300">Bắn hạ thiên thạch chứa nghĩa đúng 60FPS mượt mà.</p>
                                </button>
                                <button onclick="window.appState.gameMode = 'blocks'; renderApp();" class="p-8 rounded-3xl bg-emerald-600/20 border border-emerald-500/40 hover:border-emerald-500 text-left space-y-3 cursor-pointer shadow-xl">
                                    <div class="text-xl font-black text-white">📦 Blocks (Xếp gạch 8x8)</div>
                                    <p class="text-xs text-slate-300">Xếp gạch trí tuệ kết hợp từ vựng.</p>
                                </button>
                            </div>
                        </div>
                    `;
                } else if (appState.gameMode === 'blast') {
                    mainEl.innerHTML = `
                        <div class="max-w-xl mx-auto rounded-3xl bg-slate-900 border border-indigo-500/40 p-8 space-y-6 text-center shadow-2xl animate-fadeIn">
                            <button onclick="window.appState.gameMode = 'menu'; renderApp();" class="text-xs font-bold text-indigo-400 cursor-pointer">← Chọn game khác</button>
                            <h3 class="text-xl font-black text-white">🚀 Blast Arcade</h3>
                            <p class="text-sm text-slate-300">Trò chơi phản xạ từ vựng tốc độ cao đã sẵn sàng!</p>
                            <button onclick="window.appState.gameMode = 'menu'; renderApp();" class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm cursor-pointer">Quay lại</button>
                        </div>
                    `;
                } else if (appState.gameMode === 'blocks') {
                    mainEl.innerHTML = `
                        <div class="max-w-xl mx-auto rounded-3xl bg-slate-900 border border-emerald-500/40 p-8 space-y-6 text-center shadow-2xl animate-fadeIn">
